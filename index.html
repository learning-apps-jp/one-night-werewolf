<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11182b"><title>ひと晩の人狼</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311182b'/%3E%3Cpath d='M23 7A11 11 0 1 0 25 24A10 10 0 0 1 23 7' fill='%23edcd87'/%3E%3C/svg%3E"><style>:root{color-scheme:dark;font-family:"Yu Gothic UI","Hiragino Sans",sans-serif;color:#eef1f8;background:#101626;--muted:#aeb8ce;--gold:#efd094;--line:#354057}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#243047 0,transparent 55%),#101626;min-height:100vh}header{max-width:1120px;margin:auto;padding:25px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}header a{color:var(--gold);text-decoration:none;font-size:24px;font-weight:700;display:flex;gap:12px}header span:last-child:not(a span){font-size:12px;letter-spacing:.15em;color:var(--muted)}main{max-width:1040px;margin:auto;padding:36px 28px;min-height:calc(100vh - 150px)}footer{text-align:center;color:#8895af;font-size:13px;padding:15px 20px 25px}h1{font-size:clamp(30px,4vw,46px);margin:10px 0 14px;line-height:1.3}h2{font-size:25px;margin:0 0 18px}h3{font-size:19px;margin:0 0 12px}p{color:var(--muted);line-height:1.8;margin:10px 0 20px;font-size:16px}.eyebrow{color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.16em}.intro{margin-bottom:28px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:#1b2336;border:1px solid var(--line);border-radius:20px;padding:26px}.panel.soft{background:#171f31}.row{display:flex;gap:14px;align-items:center;justify-content:space-between}.stack{display:grid;gap:12px}.names{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}label{font-size:14px;color:var(--muted);display:grid;gap:7px}input,select{font:inherit;color:inherit;bac <body><header><a href="./" aria-label="ひと晩の人狼 ホーム">◒ <span>ひと晩の人狼</span></a><span id="phase">ONE NIGHT</span></header><main id="app"></main><footer>ひとつの画面を囲んで、ひと晩の推理。</footer><div id="privacy" hidden><div class="panel"><span class="eyebrow">画面を隠しました</span><h2>本人だけで確認</h2><p>周りの人に見えないように持ってください。</p><button id="resume">続きの画面を開く</button></div></div><script>'use strict';
const ROLES={wolf:{name:'人狼',text:'ほかの人狼を確認。自分だけなら中央の札を1枚確認できます。'},seer:{name:'占い師',text:'ほかの人1人、または中央の札2枚を確認できます。'},robber:{name:'怪盗',text:'ほかの人1人と交換し、受け取る役職を確認できます。'},trouble:{name:'トラブルメーカー',text:'自分以外の2人の役職を交換。中身は見られません。'},insomniac:{name:'不眠症',text:'夜の終わりに、自分の最終的な役職を確認できます。'},villager:{name:'村人',text:'夜の行動はありません。昼の話し合いで人狼を探しましょう。'}};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let config={names:['プレイヤー1','プレイヤー2','プレイヤー3','プレイヤー4'],counts:{wolf:2,seer:1,robber:1,trouble:1,insomniac:0,villager:2},minutes:5};
let game=null,screen='setup',selected=[],mode='',revealed=false,timer=null,remaining=300,running=false;
function phase(s){$('#phase').textContent=s;}
function paint(html){app.innerHTML=html;window.scrollTo(0,0);}
function button(text,action,cls=''){return `<button class="${cls}" data-action="${action}">${text}</button>`;}
function setup(){screen='setup';phase('ゲームの準備');paint(`<div class="intro"><span class="eyebrow">PASS & PLAY · 3–8人</span><h1>今夜、人狼は誰？</h1><p>役職を秘密に確認したら、タブレットを次の人へ。</p></div><div class="layout"><section class="panel"><div class="row"><h2>参加する人</h2><div class="actions">${button('−','minus','secondary small')}${button('＋','plus','secondary small')}</div></div><div class="names">${config.names.map((n,i)=>`<label>プレイヤー${i+1}<input data-name="${i}" value="${esc(n)}" maxlength="20" autocomplete="off"></label>`).join('')}</div><label style="margin-top:24px">話し合いの時間<select id="minutes">${[3,5,7,10].map(m=>`<option value="${m}" ${config.minutes===m?'selected':''}>${m}分</option>`).join('')}</select></label><p class="note">全員が読める名前を入れてください。</p></section><section class="panel soft"><div class="row"><h2>今夜の役職</h2><span id="count" class="badge"></span></div><div>${Object.entries(ROLES).map(([k,r])=>`<label class="role-row"><div><strong>${r.name}</strong><span>${k==='wolf'?'人狼陣営':'村人陣営'}</span></div><input aria-label="${r.name}の枚数" type="number" min="0" max="${k==='wolf'?2:k==='villager'?8:1}" data-role="${k}" value="${config.counts[k]}"></label>`).join('')}</div><p class="note">参加人数＋中央の3枚。人狼は1〜2枚、特殊役職は各1枚まで。</p>${button('おすすめの配役に戻す','preset','secondary small')}</section></div><div id="error" class="error" role="alert"></div>${button('札を配って、夜を始める','start','wide')}<details><summary>遊び方と、このアプリのルール</summary><p>夜は全員が順番に役職を確認して行動します。中央の3枚は誰にも配られない札です。占いは夜の始めの札を見ます。交換は怪盗 → トラブルメーカーの順で処理し、最後に不眠症が確認します。怪盗とトラブルメーカーは行動を見送ることもできます。</p><p>昼は自由に話し合い、嘘をついてもかまいません。最後に自分以外の1人へ秘密投票。2票以上を集めた最多得票者を処刑します。同数なら全員処刑、全員1票以下なら処刑なしです。</p><p>勝敗は交換後の役職で決まります。人狼がいる場合は1人でも人狼を処刑すると村人陣営の勝ち。誰も人狼でなければ、処刑なしで村人陣営の勝ちです。本アプリは6種類の役職を使う簡易ルールです。</p><p>受け渡す前に必ず「隠して次の人へ」を押してください。画面を離れると秘密の画面を隠します。途中でページを再読み込みするとゲームはリセットされます。</p></details>`);count();}
function count(){const total=Object.values(config.counts).reduce((a,b)=>a+b,0);$('#count').textContent=`${total} / ${config.names.length+3}枚`;}
function preset(){config.counts={wolf:2,seer:1,robber:1,trouble:1,insomniac:config.names.length>=5?1:0,villager:config.names.length-2-(config.names.length>=5?1:0)};setup();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const buf=new Uint32Array(1);let x;const limit=Math.floor(4294967296/(i+1))*(i+1);do{crypto.getRandomValues(buf);x=buf[0];}while(x>=limit);const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){const n=config.names.map(x=>x.trim());const c=config.counts;let err='';if(n.some(x=>!x))err='全員の名前を入れてください。';else if(new Set(n).size!==n.length)err='区別できるように、名前を変えてください。';else if(Object.entries(c).some(([k,v])=>!Number.isInteger(v)||v<0||v>(k==='wolf'?2:k==='villager'?8:1)))err='役職の枚数を確認してください。';else if(c.wolf<1)err='人狼を1〜2枚入れてください。';else if(Object.values(c).reduce((a,b)=>a+b,0)!==n.length+3)err=`役職を合計${n.length+3}枚にしてください。`;if(err){$('#error').textContent=err;return;}config.names=n;const deck=shuffle(Object.entries(c).flatMap(([k,v])=>Array(v).fill(k)));game={names:[...n],original:deck.slice(0,n.length),final:deck.slice(0,n.length),center:deck.slice(n.length),i:0,stage:'night',rob:null,trouble:null,votes:[],log:[]};remaining=config.minutes*60;handoff();}
function handoff(){screen='handoff';revealed=false;selected=[];mode='';phase(game.stage==='night'?'夜 · 役職と行動':game.stage==='check'?'夜 · 最後の確認':'昼 · 秘密投票');const title=game.stage==='vote'?'秘密の投票':game.stage==='check'?'夜の終わりの確認':'役職と夜の行動';paint(`<section class="panel handoff"><div class="seal" aria-hidden="true">◒</div><span class="eyebrow">${title} · ${game.i+1} / ${game.names.length}</span><h1>${esc(game.names[game.i])}さんへ</h1><p>タブレットを渡してください。<br>本人だけが画面を見られる状態で開きます。</p><div class="progress">${game.names.map((_,i)=>`<span class="dot ${i<game.i?'done':''}"></span>`).join('')}</div>${button('私です。画面を開く','open','wide')}<p class="note">まだ役職や投票先は表示されていません。</p></section>`);}
function privateShell(content){paint(`<section class="private"><div class="secret-head"><span class="eyebrow">${esc(game.names[game.i])}さんだけの画面</span>${button('画面を隠す','hide','secondary small')}</div>${content}</section>`);}
function options(indices,center=false){return `<div class="choices">${indices.map(i=>`<button class="choice ${selected.includes((center?'c':'p')+i)?'selected':''}" aria-pressed="${selected.includes((center?'c':'p')+i)}" data-pick="${center?'c':'p'}${i}">${center?'中央 '+['A','B','C'][i]:esc(game.names[i])}</button>`).join('')}</div>`;}
function other(){return game.names.map((_,i)=>i).filter(i=>i!==game.i);}
function nextButton(){return button(game.i===game.names.length-1?'隠して、この確認を終える':'隠して次の人へ','next','wide');}
function open(){screen='private';revealed=false;selected=[];mode='';if(game.stage==='vote'){vote();return;}if(game.stage==='check'){privateShell(`<div class="panel"><h2>夜が明けます</h2>${game.original[game.i]==='insomniac'?`<p>あなたは不眠症でした。交換が終わった今の役職です。</p><div class="role-card ${game.final[game.i]==='wolf'?'wolf':''}"><span class="eyebrow">今のあなたの役職</span><h1>${ROLES[game.final[game.i]].name}</h1></div>`:'<p>あなたの最後の確認はありません。<br>全員の確認が終わったら、話し合いを始めます。</p>'}${nextButton()}</div>`);return;}night();}
function night(){const role=game.original[game.i],r=ROLES[role];let html=`<div class="role-card ${role==='wolf'?'wolf':''}"><span class="eyebrow">夜の始めのあなた</span><h1>${r.name}</h1><p>${role==='wolf'?'人狼陣営':'村人陣営'}</p></div><section class="panel"><h2>今夜の行動</h2><p>${r.text}</p>`;
if(role==='wolf'){const mates=other().filter(i=>game.original[i]==='wolf');if(mates.length)html+=`<div class="reveal">あなたの仲間<strong>${mates.map(i=>esc(game.names[i])).join('、')}</strong></div>${nextButton()}`;else if(revealed)html+=revealHTML()+nextButton();else html+=`<p>ほかの参加者に人狼はいません。中央を1枚選んでください。</p>${options([0,1,2],true)}${button('選んだ札を見る','reveal','wide')}`;}
else if(role==='seer'){if(revealed)html+=revealHTML()+nextButton();else{html+=`<div class="actions">${button('1人の役職を見る','seer-player',mode==='player'?'':'secondary')}${button('中央を2枚見る','seer-center',mode==='center'?'':'secondary')}</div>`;if(mode)html+=`<p>${mode==='center'?'中央の札を2枚選んでください。':'確認する人を選んでください。'}</p>${mode==='center'?options([0,1,2],true):options(other())}${button('選んだ札を見る','reveal','wide')}`;}}
else if(role==='robber'||role==='trouble'){if(revealed){html+=role==='robber'?revealHTML():`<div class="reveal">${selected.map(t=>esc(game.names[+t.slice(1)])).join('さんと')}さんの交換を予約しました。<p>中身は確認できません。</p></div>`;html+=nextButton();}else html+=`${options(other())}${button(role==='robber'?'この人と交換する':'この2人を交換する','exchange','wide')}${button('交換せずに終える','skip','secondary wide')}`;}
else html+=`<p>${role==='insomniac'?'全員の行動が終わった後、もう一度タブレットを回します。そのときに自分の役職を確認してください。':'今夜は静かに休みます。最初の役職を覚えておきましょう。'}</p>${nextButton()}`;
privateShell(html+'</section>');const confirm=$('[data-action="reveal"], [data-action="exchange"]');if(confirm)confirm.disabled=selected.length!==(role==='trouble'||(role==='seer'&&mode==='center')?2:1);}
function revealHTML(){return `<div class="reveal">${selected.map(t=>`<span>${t[0]==='c'?'中央 '+['A','B','C'][+t.slice(1)]:esc(game.names[+t.slice(1)])+'さん'}${game.original[game.i]==='robber'?'と交換して受け取る役職':''}</span><strong>${ROLES[t[0]==='c'?game.center[+t.slice(1)]:game.original[+t.slice(1)]].name}</strong>`).join('')}</div>`;}
function resolveNight(){game.final=[...game.original];if(game.rob){const [a,b]=game.rob;[game.final[a],game.final[b]]=[game.final[b],game.final[a]];game.log.push(`怪盗：${game.names[a]}さんと${game.names[b]}さんを交換`);}if(game.trouble){const[a,b]=game.trouble;[game.final[a],game.final[b]]=[game.final[b],game.final[a]];game.log.push(`トラブルメーカー：${game.names[a]}さんと${game.names[b]}さんを交換`);}}
function next(){hideOff();game.i++;if(game.i<game.names.length){handoff();return;}game.i=0;if(game.stage==='night'){resolveNight();game.stage='check';handoff();}else if(game.stage==='check')discussion();else results();}
function discussion(){screen='discussion';phase('昼 · 話し合い');paint(`<section class="discussion"><span class="eyebrow">全員で画面を見てください</span><h1>朝になりました。</h1><p>見た札、交換した相手、気になる発言。<br>情報を持ち寄って、人狼を見つけましょう。</p><div class="badges">${Object.entries(config.counts).filter(([,v])=>v).map(([k,v])=>`<span class="badge">${ROLES[k].name} × ${v}</span>`).join('')}</div><div class="panel"><div id="clock" class="clock"></div><div class="actions">${button('タイマーを始める','timer')}${button('時間を戻す','reset-time','secondary')}</div><p class="note">時間が来ても、自動で投票には進みません。</p></div>${button('話し合いを終えて、秘密投票へ','begin-vote','secondary wide')}<p class="note">勝敗は夜の交換が終わった後の役職で決まります。</p></section>`);clock();}
function clock(){if(!$('#clock'))return;$('#clock').textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;const b=$('[data-action="timer"]');b.textContent=running?'一時停止':remaining===0?'時間になりました':'タイマーを始める';b.disabled=remaining===0;}
let deadline=0;
function stopTimer(){clearInterval(timer);timer=null;running=false;}
function toggleTimer(){if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stopTimer();}else{running=true;deadline=Date.now()+remaining*1000;timer=setInterval(()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!remaining)stopTimer();clock();},250);}clock();}
function vote(){privateShell(`<div class="panel"><span class="eyebrow">秘密投票</span><h1>人狼だと思う人は？</h1><p>自分以外の1人を選んでください。投票先は結果発表まで隠します。</p>${options(other())}${button('投票を確定して、画面を隠す','cast','wide')}</div>`);$('[data-action="cast"]').disabled=selected.length!==1;}
function outcome(g){const counts=g.names.map((_,i)=>g.votes.filter(v=>v===i).length),max=Math.max(...counts),exiled=counts.map((v,i)=>v===max&&max>=2?i:-1).filter(i=>i>=0),wolves=g.final.map((r,i)=>r==='wolf'?i:-1).filter(i=>i>=0),village=wolves.length?exiled.some(i=>wolves.includes(i)):exiled.length===0;return {counts,exiled,wolves,village};}
function results(){screen='results';phase('結果発表');const o=outcome(game);paint(`<span class="eyebrow">夜が明けて、正体がわかる</span><h1 class="win">${o.village?'村人陣営の勝ち':o.wolves.length?'人狼陣営の勝ち':'村人陣営の負け'}</h1><p>${o.exiled.length?'処刑された人：'+o.exiled.map(i=>esc(game.names[i])+'さん').join('、'):'全員の得票が1票以下のため、処刑なし。'}<br>${o.wolves.length?(o.village?'人狼が処刑されました。':'人狼は誰も処刑されませんでした。'):'参加者の中に人狼はいませんでした。'}</p><section class="panel"><h2>最後の役職</h2><table class="result-table"><thead><tr><th>名前</th><th>最初</th><th>最後</th><th>得票</th></tr></thead><tbody>${game.names.map((n,i)=>`<tr class="${o.exiled.includes(i)?'exiled':''}"><td>${esc(n)}${o.exiled.includes(i)?'<br><span class="note">処刑</span>':''}</td><td>${ROLES[game.original[i]].name}</td><td>${ROLES[game.final[i]].name}</td><td>${o.counts[i]}票</td></tr>`).join('')}</tbody></table><p class="note">勝った人：${game.names.filter((_,i)=>o.village?game.final[i]!=='wolf':o.wolves.length&&game.final[i]==='wolf').map(esc).join('、')||'なし'}</p></section><div class="public-grid" style="margin-top:22px"><section class="panel"><h3>中央の札</h3><div class="badges">${game.center.map((r,i)=>`<span class="badge">${['A','B','C'][i]} · ${ROLES[r].name}</span>`).join('')}</div><h3 style="margin-top:20px">夜の交換</h3><p>${game.log.length?game.log.map(esc).join('<br>'):'交換はありませんでした。'}</p></section><section class="panel"><h3>投票の記録</h3><div class="stack">${game.names.map((n,i)=>`<div class="row"><span>${esc(n)}</span><span class="muted">→ ${esc(game.names[game.votes[i]])}</span></div>`).join('')}</div></section></div>${button('同じメンバーでもう一度','again','wide')}${button('人数・配役を変更する','setup','secondary wide')}`);}
function hide(){if(screen==='private')$('#privacy').hidden=false;}
function hideOff(){$('#privacy').hidden=true;}
$('#resume').onclick=hideOff;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hide();});window.addEventListener('blur',hide);
app.addEventListener('input',e=>{if(e.target.dataset.name!==undefined)config.names[+e.target.dataset.name]=e.target.value;if(e.target.dataset.role){config.counts[e.target.dataset.role]=Number(e.target.value);count();}if(e.target.id==='minutes')config.minutes=+e.target.value;});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.action,t=b.dataset.pick;if(t){const role=game.original[game.i],limit=game.stage==='vote'?1:role==='trouble'||(role==='seer'&&mode==='center')?2:1;if(selected.includes(t))selected=selected.filter(x=>x!==t);else if(limit===1)selected=[t];else if(selected.length<limit)selected.push(t);game.stage==='vote'?vote():night();return;}switch(a){case'plus':if(config.names.length<8){config.names.push('プレイヤー'+(config.names.length+1));preset();}break;case'minus':if(config.names.length>3){config.names.pop();preset();}break;case'preset':preset();break;case'start':start();break;case'open':open();break;case'hide':hide();break;case'seer-player':mode='player';selected=[];night();break;case'seer-center':mode='center';selected=[];night();break;case'reveal':revealed=true;night();break;case'exchange':if(game.original[game.i]==='robber')game.rob=[game.i,+selected[0].slice(1)];else game.trouble=selected.map(t=>+t.slice(1));revealed=true;night();break;case'skip':next();break;case'next':next();break;case'timer':toggleTimer();break;case'reset-time':stopTimer();remaining=config.minutes*60;clock();break;case'begin-vote':stopTimer();game.stage='vote';game.i=0;handoff();break;case'cast':game.votes[game.i]=+selected[0].slice(1);next();break;case'again':start();break;case'setup':stopTimer();game=null;setup();break;}});
setup();
</script></body></html>
